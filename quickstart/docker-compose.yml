# =====================================================================
# 健康管理系统 docker-compose (健康化部署方案 v1.0)
# 进哥 7/7 08:04 拍板放弃 PowerShell 部署链路后, 抢救答辩 demo 用
# 入仓 + OPC_K skills/deploy 沉淀版
# =====================================================================
# 用法:
#   docker compose up -d           # 拉起 mariadb + backend + frontend
#   docker compose logs -f         # 看日志
#   docker compose down            # 全停 (数据保留)
#   docker compose down -v         # 全停 + 删数据 (完全重置)
# 访问:
#   Frontend: http://localhost:5173
#   Backend : http://localhost:8090/api
#   MariaDB : mariadb:3306 (root/opck2026)
# =====================================================================

services:

  mariadb:
    image: mariadb:11.8
    container_name: health-mgmt-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: opck2026
      MARIADB_DATABASE: health_management
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    image: eclipse-temurin:17-jre
    container_name: health-mgmt-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8090:8090"
    volumes:
      - ../target/health-management-1.0.0.jar:/app/app.jar:ro
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mariadb:3306/health_management?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: opck2026
      SERVER_PORT: "8090"
      JAVA_OPTS: "-Xms256m -Xmx512m"
    command:
      - java
      - -jar
      - /app/app.jar

  frontend:
    image: nginx:alpine
    container_name: health-mgmt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    volumes:
      - ../frontend-pc/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mariadb-data:
    name: health-mgmt-mariadb-data
